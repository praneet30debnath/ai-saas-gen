name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: node test.js
      - name: Test CLI generation
        run: |
          node src/cli.js "dental" --json > /dev/null
          node src/cli.js "fitness" --md > /dev/null
          node src/cli.js --list > /dev/null
      - name: Test programmatic API
        run: |
          node -e "const {generate, listVerticals} = require('./src/index.js'); const p = generate('dental'); console.log(p.business.name); console.log(listVerticals().length + ' verticals');"
